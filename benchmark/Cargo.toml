[package]
name = "typst-parser-benchmark"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
core_affinity = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "=0.26.13"
tree-sitter-language = "0.1"
typst-syntax = "=0.15.1"

[build-dependencies]
cc = "1.2"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
debug = false
panic = "abort"
